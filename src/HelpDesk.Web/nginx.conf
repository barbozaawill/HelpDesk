server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html (o Blazor cuida do roteamento).
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Garante o MIME correto do WebAssembly (nginx antigo nao conhece .wasm).
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Nao cachear o index.html pra sempre pegar a versao nova apos um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;
}
